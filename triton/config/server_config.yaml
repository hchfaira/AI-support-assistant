# Triton server launch configuration used both locally (docker-compose) and
# in the Snowpark Container Services service spec.

http_port: 8000
grpc_port: 8001
metrics_port: 8002

# Keep model-config inference lenient during development; set to `true` and
# commit a strict `config.pbtxt` for every model before production rollout.
strict_model_config: false

log_verbose: 1

# Rate-limit/backoff for model loading on startup.
model_control_mode: "explicit"
load_models: ["embedding_model", "reranker_model", "llm_model"]
